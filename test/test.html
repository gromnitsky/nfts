    border: 1px solid gray;
    padding: 1em;

<p><button>Toggle Search</button></p>

<div id="search">
  <p><i>nfts frame gets injected in the parent of this &lt;p&gt;</i></p>
</div>

  quis odio.  Nunc porta vulputate tellus.  Nunc rutrum turpis sed pede.
  Sed bibendum.

<input>

<script type="module">
  import * as nfts from '../web.js'

  let conf = {
      "toggle_button": "button",
      "container": "#search",
      "server": "http://localhost:3000",
      "debounce": 200
  }
  new nfts.Frame(conf, e => {
      let prefix = nfts.date_fmt(e.file.slice(0,10))
      let basename = e.file.slice(10+1).replace(/\.[^.]+$/, '')
      return 'http://example.com/'+prefix+'/'+`${basename}.html`
  }, null, null)
</script>
